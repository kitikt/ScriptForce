<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScriptForge Loading</title>
    <style>
      :root {
        color-scheme: dark;
        --text: #fbf7ff;
        --muted: #c9bbe7;
        --soft: rgba(228, 210, 255, 0.72);
        --violet: #a978ff;
        --violet-strong: #863bff;
        --violet-glow: rgba(169, 120, 255, 0.54);
        --panel: rgba(34, 24, 56, 0.68);
        --panel-soft: rgba(255, 255, 255, 0.08);
        --line: rgba(229, 211, 255, 0.24);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: center;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        color: var(--text);
        background: transparent;
      }

      body::before {
        content: none;
      }

      .window {
        width: 300px;
        height: 300px;
        padding: 0;
        display: grid;
        place-items: center;
        border: 0;
        border-radius: 999px;
        background: transparent;
        box-shadow: none;
        backdrop-filter: none;
      }

      .logoStage {
        position: relative;
        width: 268px;
        height: 268px;
        margin: 0;
        display: grid;
        place-items: center;
      }

      .halo {
        position: absolute;
        inset: 34px;
        border-radius: 999px;
        background:
          radial-gradient(circle, rgba(251, 247, 255, 0.18) 0 14%, rgba(169, 120, 255, 0.2) 15% 38%, rgba(97, 61, 158, 0.18) 39% 52%, transparent 72%);
        box-shadow:
          0 0 44px rgba(169, 120, 255, 0.44),
          0 0 94px rgba(134, 59, 255, 0.28);
        animation: breathe 2.2s ease-in-out infinite;
      }

      .orbit {
        position: absolute;
        inset: 54px;
        border: 1px solid rgba(229, 211, 255, 0.28);
        border-radius: 999px;
        box-shadow: 0 0 24px rgba(169, 120, 255, 0.1);
      }

      .orbit.one {
        transform: rotateZ(18deg) rotateX(68deg);
        animation: orbitOne 3.4s linear infinite;
      }

      .orbit.two {
        inset: 58px;
        transform: rotateZ(104deg) rotateX(64deg);
        animation: orbitTwo 4.7s linear infinite;
      }

      .orbit.three {
        inset: 64px;
        border-color: rgba(229, 211, 255, 0.18);
        transform: rotateZ(150deg) rotateX(72deg);
        animation: orbitThree 6.2s linear infinite;
      }

      .electron {
        position: absolute;
        top: 50%;
        left: -5px;
        width: 10px;
        height: 10px;
        margin-top: -5px;
        border-radius: 999px;
        background: #e9dcff;
        box-shadow:
          0 0 14px rgba(233, 220, 255, 0.96),
          0 0 30px rgba(169, 120, 255, 0.72);
      }

      .orbit.two .electron {
        width: 8px;
        height: 8px;
        margin-top: -4px;
        background: #b991ff;
      }

      .orbit.three .electron {
        width: 6px;
        height: 6px;
        margin-top: -3px;
        background: rgba(255, 255, 255, 0.84);
      }

      .logoShell {
        position: relative;
        z-index: 3;
        width: 104px;
        height: 104px;
        display: grid;
        place-items: center;
        border-radius: 999px;
        background:
          radial-gradient(circle at 36% 30%, rgba(255, 255, 255, 0.2), transparent 28%),
          radial-gradient(circle, rgba(169, 120, 255, 0.3), rgba(41, 28, 68, 0.78) 58%, rgba(25, 18, 44, 0.9));
        box-shadow:
          0 22px 58px rgba(83, 46, 145, 0.5),
          0 0 46px rgba(169, 120, 255, 0.28),
          inset 0 1px 0 rgba(255, 255, 255, 0.2),
          inset 0 -18px 34px rgba(14, 9, 26, 0.3);
        animation: logoOrbitSpin 5.8s linear infinite;
      }

      .circleText {
        position: absolute;
        inset: 4px;
        z-index: 5;
        overflow: visible;
        animation: circleTextSpin 8s linear infinite;
        filter:
          drop-shadow(0 0 8px rgba(229, 211, 255, 0.34))
          drop-shadow(0 0 20px rgba(169, 120, 255, 0.18));
      }

      .circleText text {
        fill: rgba(251, 247, 255, 0.94);
        font-size: 10.5px;
        font-weight: 900;
        letter-spacing: 3.4px;
        text-transform: uppercase;
      }

      .logoShell::after {
        content: "";
        position: absolute;
        inset: -10px;
        border-radius: 999px;
        border: 1px solid rgba(229, 211, 255, 0.2);
        box-shadow:
          0 0 28px rgba(169, 120, 255, 0.18),
          inset 0 0 18px rgba(229, 211, 255, 0.06);
        opacity: 0.82;
      }

      .atomMark {
        width: 58px;
        height: 58px;
        overflow: visible;
        filter: drop-shadow(0 0 12px rgba(214, 196, 255, 0.42));
        animation: atomCounterSpin 5.8s linear infinite;
      }

      .atomMark .ring {
        fill: none;
        stroke: rgba(229, 211, 255, 0.78);
        stroke-width: 3.2;
        stroke-linecap: round;
      }

      .atomMark .ringSoft {
        stroke: rgba(185, 145, 255, 0.62);
      }

      .atomMark .coreDot {
        fill: #efe6ff;
        filter: drop-shadow(0 0 8px rgba(233, 220, 255, 0.9));
        animation: corePulse 1.8s ease-in-out infinite;
      }

      .atomMark .spark {
        fill: #b991ff;
        filter: drop-shadow(0 0 8px rgba(185, 145, 255, 0.76));
      }

      .brand {
        display: none;
      }

      .subtitle {
        display: none;
      }

      .progress {
        display: none;
      }

      .bar {
        width: 8%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #efe6ff, #b88cff, var(--violet-strong));
        box-shadow:
          0 0 18px rgba(169, 120, 255, 0.58),
          0 0 34px rgba(134, 59, 255, 0.32);
        transition: width 420ms ease;
      }

      .meta {
        display: none;
      }

      .percent {
        color: #f5eeff;
        font-variant-numeric: tabular-nums;
      }

      @keyframes orbitOne {
        to {
          transform: rotateZ(378deg) rotateX(68deg);
        }
      }

      @keyframes orbitTwo {
        to {
          transform: rotateZ(-256deg) rotateX(64deg);
        }
      }

      @keyframes orbitThree {
        to {
          transform: rotateZ(510deg) rotateX(72deg);
        }
      }

      @keyframes breathe {
        0%,
        100% {
          transform: scale(0.96);
          opacity: 0.74;
        }
        50% {
          transform: scale(1.08);
          opacity: 1;
        }
      }

      @keyframes logoOrbitSpin {
        0%,
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes circleTextSpin {
        to {
          transform: rotate(-360deg);
        }
      }

      @keyframes atomCounterSpin {
        0%,
        100% {
          transform: rotate(-360deg) scale(1);
        }
      }

      @keyframes corePulse {
        0%,
        100% {
          transform: scale(0.9);
          transform-origin: center;
          opacity: 0.82;
        }
        50% {
          transform: scale(1.12);
          transform-origin: center;
          opacity: 1;
        }
      }
    </style>
  </head>
  <body>
    <main class="window" aria-label="Đang khởi động ScriptForge">
      <section class="logoStage" aria-hidden="true">
        <svg class="circleText" viewBox="0 0 268 268">
          <defs>
            <path id="textCircle" d="M 134 134 m -101 0 a 101 101 0 1 1 202 0 a 101 101 0 1 1 -202 0" />
          </defs>
          <text>
            <textPath href="#textCircle" startOffset="50%" text-anchor="middle">
              SCRIPT FORGE * AUTOMATION * SCRIPT FORGE *
            </textPath>
          </text>
        </svg>
        <div class="halo"></div>
        <div class="orbit one"><span class="electron"></span></div>
        <div class="orbit two"><span class="electron"></span></div>
        <div class="orbit three"><span class="electron"></span></div>
        <div class="logoShell">
          <svg class="atomMark" viewBox="0 0 96 96" aria-hidden="true">
            <ellipse class="ring" cx="48" cy="48" rx="35" ry="13" transform="rotate(28 48 48)" />
            <ellipse class="ring ringSoft" cx="48" cy="48" rx="35" ry="13" transform="rotate(90 48 48)" />
            <ellipse class="ring" cx="48" cy="48" rx="35" ry="13" transform="rotate(152 48 48)" />
            <circle class="coreDot" cx="48" cy="48" r="7" />
            <circle class="spark" cx="76" cy="42" r="3.4" />
            <circle class="spark" cx="28" cy="66" r="2.8" opacity="0.82" />
          </svg>
        </div>
      </section>

      <h1 class="brand">ScriptForge</h1>
      <p class="subtitle">Automation</p>

      <div class="progress">
        <div class="bar" id="bar"></div>
      </div>

      <div class="meta">
        <span id="status">Đang khởi động app...</span>
        <span class="percent" id="percent">8%</span>
      </div>
    </main>

    <script>
      const statusNode = document.getElementById("status");
      const percentNode = document.getElementById("percent");
      const barNode = document.getElementById("bar");
      const statuses = [
        "Đang khởi động app...",
        "Đang mở server nội bộ...",
        "Đang chuẩn bị giao diện...",
        "Đang nạp automation...",
        "Gần xong rồi..."
      ];
      let percent = 8;
      let tick = 0;

      setInterval(() => {
        tick += 1;
        percent = Math.min(96, percent + Math.ceil(Math.random() * 6));
        percentNode.textContent = `${percent}%`;
        barNode.style.width = `${percent}%`;
        statusNode.textContent = statuses[tick % statuses.length];
      }, 420);
    </script>
  </body>
</html>
